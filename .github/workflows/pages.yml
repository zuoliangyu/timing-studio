name: 发布 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: taiki-e/install-action@wasm-pack
      - run: npm ci
      - run: npm run wasm
      - run: npx tsc -b
      - run: npx vite build --mode pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # 同一份产物同步到 Netlify（主站）。Netlify 跑在根路径，用 _redirects 把 GitHub Pages
      # 的 /timing-studio/ 子路径重写到根下同名文件。
      - name: 发布到 Netlify
        run: |
          rm -rf .netlify-out && mkdir .netlify-out
          cp -r dist/. .netlify-out/
          echo '/timing-studio/*  /:splat  200' >> .netlify-out/_redirects
          npx --yes netlify-cli@26 deploy --prod --no-build --dir=.netlify-out --message "${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v5
